name: Build VNTools on Ubuntu

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout source code
      uses: actions/checkout@v4

    - name: Install build dependencies
      run: |
        sudo apt update
        # 明确安装 autoconf, automake, libtool 等全套构建工具
        sudo apt install -y autoconf automake libtool build-essential

    - name: Generate configure script and build
      run: |
        # 给 autogen.sh 添加执行权限后再运行
        chmod +x ./autogen.sh
        ./autogen.sh
        ./configure
        make

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: vntools-binaries
        path: |
          cromwell/opk
          cromwell/pak
          ikura/ggp
          ikura/sm2mpx10
          nekopunch/nekopunch_unpack
          silky/ifl
          pinpai/hiz
          # 如果有其他编译出的工具，也可以加在这里
