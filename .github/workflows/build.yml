name: Build VNTools on Ubuntu

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout source code
      uses: actions/checkout@v4

    - name: Install build dependencies
      run: |
        sudo apt update
        # 明确安装 autoconf, automake, libtool 等全套构建工具
        sudo apt install -y autoconf automake libtool build-essential

    - name: Generate configure script and build
      run: |
        # 使用 autoreconf 生成 configure（仓库中没有 autogen.sh）
        autoreconf -fi
        ./configure
        make

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: vntools-binaries
        path: |
          opk
          cromwell_pak_unpack
          nekopunch_unpack
          arcx_unpack
          mif_unpack
          ng3_unpack
          cgd2bmp
          ggp_decrypt
          sm2mpx10
          ifl
          succubus_arc_unpack
          studio-sakura_unpack
          hiz
